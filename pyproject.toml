[project]
name = "fpo-workbench"
version = "0.1.0"
description = "Plan, ingest, doctor, and report on FPO++ flow-policy RL training runs."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
    "pyyaml>=6.0",
]

[project.optional-dependencies]
tensorboard = ["tensorboard>=2.14"]
dev = ["pytest>=8.0", "ruff>=0.8"]

[project.scripts]
fpo-workbench = "fpo_workbench.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["fpo_workbench"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"
